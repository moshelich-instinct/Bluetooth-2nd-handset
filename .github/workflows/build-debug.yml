name: Build debug APK

on:
  push:
    branches: [android-11-support]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fresno-gateway-android11-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Attach APK to a prerelease for easy download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android11-debug
          target_commitish: android-11-support
          name: Android 11 debug build (automated test build)
          body: |
            Automated debug APK built by GitHub Actions from the `android-11-support` branch.
            Signed with a throwaway CI debug keystore, NOT the project's release keystore.
            For personal testing only - uninstall any release-signed copy before installing.
          files: app/build/outputs/apk/debug/app-debug.apk
          prerelease: true
